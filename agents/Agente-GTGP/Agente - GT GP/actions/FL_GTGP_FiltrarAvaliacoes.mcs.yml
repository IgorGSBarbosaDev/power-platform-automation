mcs.metadata:
  componentName: FL_GTGP_FiltrarAvaliacoes
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: text
    description: |-
      Nota de performance utilizada como filtro.

      Extraia somente a nota solicitada pelo usuário.

      Exemplos:
      "nota 5" → 5
      "tiraram 4" → 4

  - kind: AutomaticTaskInput
    propertyName: text_1
    description: |-
      Potencial utilizado como filtro.

      Extraia somente o potencial solicitado pelo usuário e mantenha a nomenclatura utilizada na base.

      Exemplos:
      "potencial AP" → AP
      "nota 5 e AP" → AP

  - kind: AutomaticTaskInput
    propertyName: text_2
    description: |-
      Define se a consulta deve considerar qualquer avaliação histórica ou somente a última avaliação registrada na base.

      Valores permitidos:
      - qualquer
      - ultima

      Use "ultima" somente quando o usuário mencionar explicitamente:
      - última avaliação;
      - avaliação mais recente;
      - último ciclo;
      - última nota/potencial;
      ou equivalente.

      Nos demais casos, use "qualquer".

      Exemplos:
      "quem tirou 5 e AP?" → qualquer
      "quem tirou 5 e AP na última avaliação?" → ultima

  - kind: AutomaticTaskInput
    propertyName: text_3
    description: |-
      Filtro coletivo opcional: Nenhum, CEO3/CEO4/CEO5 para área atual,
      AreaFimCEO1..5 para destino, Programa, Status, Enquadre, GeracaoGT,
      GeracaoGP, Localidade, Cargo, IndustrialStaff ou STEM.
      Para área sem nível explícito, use CEO4. Para Pool RH, use Status.
      Se não houver filtro coletivo, use Nenhum.
      Use Programa somente quando GT/GP for mencionado explicitamente.

  - kind: AutomaticTaskInput
    propertyName: text_4
    description: |-
      Valor correspondente ao filtro de grupo.

      Se campoGrupo = Nenhum, use obrigatoriamente:
      Nenhum

      Quando o usuário usar RH, Recursos Humanos ou HR como área, use Human Resources. Para o status Pool RH, preserve Pool RH.
      Não pergunte ao usuário por um filtro adicional quando ele não tiver solicitado um.

modelDisplayName: Filtrar avaliações GT/GP
modelDescription: |-
  Filtra participantes por Nota e Potencial na última avaliação ou em qualquer ciclo, com filtro coletivo opcional. Registros com performance restrita permanecem visíveis no grupo, sem nota, potencial, histórico ou ciclo. Para consulta de um ciclo específico, use ConsultarAvaliacoes.
outputs:
  - propertyName: status
    description: Indica se há participantes GT/GP que atendem aos critérios de Nota, Potencial e ao filtro organizacional opcional.

  - propertyName: quantidade
    description: Quantidade de correspondências de Nota/Potencial confirmadas. Pessoas restritas ficam fora dessa contagem.

  - propertyName: resultado
    description: Lista completa dos participantes encontrados. Registros restritos mostram identificação e StatusAvaliacao Restrita, sem dados de performance; demais registros incluem última avaliação e histórico.

action:
  kind: InvokeFlowTaskAction
  flowId: 5de91af7-b5a7-f111-b8dc-000d3a3617ed
  connectionProperties:
    $kind: ConnectionProperties
    diagnostics:
    mode: Invoker
    usageDescription: Use sua conta corporativa para consultar os dados autorizados de avaliação dos programas GT e GP.

outputMode: All
