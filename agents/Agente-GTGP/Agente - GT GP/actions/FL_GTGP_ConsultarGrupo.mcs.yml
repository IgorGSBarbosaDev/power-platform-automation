mcs.metadata:
  componentName: FL_GTGP_ConsultarGrupo
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: text
    description: |-
      Use um único critério coletivo: CEO3, CEO4 ou CEO5 para área atual;
      AreaFimCEO1 a AreaFimCEO5 para área final; ou Programa, Status,
      Enquadre, GeracaoGT, GeracaoGP, Localidade, Cargo, IndustrialStaff, STEM.
      CEO1 e CEO2 representam apenas os níveis 1 e 2 da área final.
      Para área sem nível explícito, como RH, use CEO4 (área atual).
      Use Programa somente quando o usuário mencionar GT, GP,
      Global Trainee ou Global Professional explicitamente.
      "Trainees" ou "participantes" não define Programa.

  - kind: AutomaticTaskInput
    propertyName: text_1
    description: |-
      Valor do critério informado. Para RH/Recursos Humanos/HR como área,
      use CEO4 e Human Resources. Para Pool RH, use Status e Pool RH.
      Preserve os demais valores conforme a base.

modelDisplayName: Consultar grupo GT/GP
modelDescription: Consulta participantes GT/GP por um único critério coletivo. Use para lista ou contagem por área atual, área final, geração, programa explícito, STEM, localidade ou outro critério suportado. Para dois ou mais critérios, use ConsultarGrupoAvancado.
outputs:
  - propertyName: status
    description: Indica se a consulta encontrou participantes correspondentes ao critério informado.

  - propertyName: quantidade
    description: Quantidade total de colaboradores encontrados. Use apenas como informação complementar à lista quando o usuário solicitar os colaboradores.

  - propertyName: resultado
    description: Lista completa com dados cadastrais, acadêmicos, área atual, área final, vaga e rotações. Ao pedir lista, apresente todos os registros retornados.

action:
  kind: InvokeFlowTaskAction
  flowId: 4024488c-f7a5-f111-b8dd-000d3a5c36cb
  connectionProperties:
    $kind: ConnectionProperties
    diagnostics:
    mode: Invoker

outputMode: All