mcs.metadata:
  componentName: FL_GTGP_ConsultarAvaliacoes
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: text
    name: Critério de busca
    description: |-
      Use Nome ou Matricula para identificar uma pessoa. Esta ferramenta
      atende somente a avaliação de um ciclo explicitamente informado.

  - kind: AutomaticTaskInput
    propertyName: text_1
    name: Valor da busca
    description: Valor a pesquisar no critério escolhido; nome pode ser parcial e matrícula deve ser integral.

  - kind: AutomaticTaskInput
    propertyName: text_2
    name: Ciclo específico
    description: Informe o ciclo exato solicitado, no formato AAAA.S, como 2026.1. Para histórico ou última avaliação sem ciclo, use ConsultarHistoricoAvaliacoes.

modelDisplayName: Consultar avaliações GT/GP
modelDescription: |-
  Consulta a nota e o potencial de uma pessoa GT/GP em um ciclo específico explicitamente solicitado. Identifique por nome ou matrícula e informe o ciclo no formato AAAA.S. Para histórico completo, evolução ou última avaliação sem ciclo, use ConsultarHistoricoAvaliacoes. Para encontrar pessoas por nota ou potencial, use FiltrarAvaliacoes. Dados restritos nunca são expostos.
outputs:
  - propertyName: status
    description: encontrado, nao_encontrado, multiplos, restrita, sem_avaliacao, ciclo_inexistente ou ciclo_invalido.

  - propertyName: resultado
    description: JSON serializado com NotaCiclo e PotencialCiclo autorizados, ou candidatos mínimos quando o nome for ambíguo. O caminho legado sem ciclo mantém a saída consolidada.

  - propertyName: quantidade
    description: Quantidade numérica de colaboradores encontrados. É uma contagem; os dados dos registros estão em resultado.

action:
  kind: InvokeFlowTaskAction
  flowId: 4aa92eae-89a7-f111-b8dc-000d3a5c36cb
  connectionProperties:
    $kind: ConnectionProperties
    diagnostics:
    mode: Invoker
    usageDescription: Use sua conta corporativa para consultar os dados autorizados de avaliações dos programas GT e GP.

outputMode: All
